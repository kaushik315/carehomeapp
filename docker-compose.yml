services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: care_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-care_app_dev_password}
      POSTGRES_DB: carehome
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U care_app -d carehome"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
